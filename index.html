<script>
(()=>{
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('shapes-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let width = 0, height = 0;
  let md3Shapes = [];

  const themeColors = {
    primaryContainer: '#2E5330',
    secondaryContainer: '#3A4F38',
    tertiaryContainer: '#3B4D47',
    surfaceHigh: '#293129'
  };

  function updateThemeColors() {
    const s = getComputedStyle(document.documentElement);
    themeColors.primaryContainer = s.getPropertyValue('--md-sys-color-primary-container').trim() || '#2E5330';
    themeColors.secondaryContainer = s.getPropertyValue('--md-sys-color-secondary-container').trim() || '#3A4F38';
    themeColors.tertiaryContainer = s.getPropertyValue('--md-sys-color-tertiary-container').trim() || '#3B4D47';
    themeColors.surfaceHigh = s.getPropertyValue('--md-sys-color-surface-container-high').trim() || '#293129';
  }

  function initShapes() {
    const minDim = Math.min(width, height);
    md3Shapes = [
      {
        type: 'flower',
        x: width * 0.12,
        y: height * 0.18,
        radius: Math.max(130, minDim * 0.25),
        lobes: 7,
        angle: 0.4,
        rotSpeed: 0.0016,
        floatPhaseX: 0,
        floatPhaseY: 1.5,
        floatSpeedX: 0.008,
        floatSpeedY: 0.011,
        floatAmpX: 38,
        floatAmpY: 28,
        colorKey: 'primaryContainer',
        alpha: 0.32
      },
      {
        type: 'squircle',
        x: width * 0.88,
        y: height * 0.35,
        radius: Math.max(115, minDim * 0.22),
        lobes: 5,
        angle: 1.8,
        rotSpeed: -0.0014,
        floatPhaseX: 2.3,
        floatPhaseY: 0.8,
        floatSpeedX: 0.009,
        floatSpeedY: 0.013,
        floatAmpX: 34,
        floatAmpY: 32,
        colorKey: 'tertiaryContainer',
        alpha: 0.34
      },
      {
        type: 'blob',
        x: width * 0.22,
        y: height * 0.75,
        radius: Math.max(125, minDim * 0.24),
        lobes: 6,
        angle: -0.8,
        rotSpeed: 0.0012,
        floatPhaseX: 4.1,
        floatPhaseY: 3.2,
        floatSpeedX: 0.011,
        floatSpeedY: 0.008,
        floatAmpX: 30,
        floatAmpY: 36,
        colorKey: 'secondaryContainer',
        alpha: 0.28
      },
      {
        type: 'pill',
        x: width * 0.80,
        y: height * 0.82,
        w: Math.max(170, minDim * 0.32),
        h: Math.max(84, minDim * 0.16),
        angle: 0.55,
        rotSpeed: -0.0011,
        floatPhaseX: 1.2,
        floatPhaseY: 4.5,
        floatSpeedX: 0.013,
        floatSpeedY: 0.010,
        floatAmpX: 26,
        floatAmpY: 24,
        colorKey: 'surfaceHigh',
        alpha: 0.40
      }
    ];
  }

  function resize() {
    width = canvas.width = innerWidth;
    height = canvas.height = innerHeight;
    updateThemeColors();
    initShapes();
  }

  function drawOrganicShape(ctx, radius, lobes, waveRatio, morphPhase) {
    const steps = 140;
    const amp = radius * waveRatio * (0.8 + 0.3 * Math.sin(morphPhase));
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2;
      const r = radius + amp * Math.cos(lobes * theta) + (radius * 0.03) * Math.sin(theta * 2);
      const px = r * Math.cos(theta);
      const py = r * Math.sin(theta);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawPill(ctx, w, h) {
    const r = h / 2;
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, r);
    ctx.closePath();
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    for (const s of md3Shapes) {
      if (!reduce) {
        s.angle += s.rotSpeed;
        s.floatPhaseX += s.floatSpeedX;
        s.floatPhaseY += s.floatSpeedY;
      }

      // Лиссажу-подобная плавная траектория вместо простого эллипса
      const cx = s.x + Math.sin(s.floatPhaseX) * s.floatAmpX;
      const cy = s.y + Math.cos(s.floatPhaseY) * s.floatAmpY;
      const scale = 1 + Math.sin(s.floatPhaseX * 0.9 + s.floatPhaseY * 0.6) * 0.05;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(s.angle);
      ctx.scale(scale, scale);

      ctx.fillStyle = themeColors[s.colorKey] || '#2E5330';
      ctx.globalAlpha = s.alpha;

      if (s.type === 'flower') {
        drawOrganicShape(ctx, s.radius, s.lobes, 0.09, s.floatPhaseX);
      } else if (s.type === 'squircle') {
        drawOrganicShape(ctx, s.radius, s.lobes, 0.065, s.floatPhaseY);
      } else if (s.type === 'blob') {
        drawOrganicShape(ctx, s.radius, s.lobes, 0.075, s.floatPhaseX + s.floatPhaseY);
      } else if (s.type === 'pill') {
        drawPill(ctx, s.w, s.h);
      }

      ctx.fill();
      ctx.restore();
    }

    if (!reduce) requestAnimationFrame(animate);
  }

  addEventListener('resize', resize);
  resize();
  animate();

  const tb = document.getElementById('topbar');
  const updateDocked = () => tb.classList.toggle('docked', scrollY > 8);
  addEventListener('scroll', updateDocked, { passive: true });
  updateDocked();
})();
</script>

<script>
(()=>{
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
  } else {
    const io=new IntersectionObserver(es=>{
      for(const e of es){
        if(!e.isIntersecting) continue;
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    },{threshold:.18});
    document.querySelectorAll('.reveal').forEach(el=>{
      if(!el.offsetParent) el.classList.add('in');
      else io.observe(el);
    });
  }
})();
(()=>{
  const I18N={
    title:{ru:'kotpro203 — bio',en:'kotpro203 — bio',lb:'kotpro203 — bio'},
    skip:{ru:'Перейти к содержимому',en:'Skip to content',lb:'Gitt op den Inhalt'},
    'hero-sub':{ru:'Просто страница со ссылками на меня',en:'Just a page with links to me',lb:'Just eng Säit mat Linken op mech'},
    'meta-desc':{ru:'kotpro203 — просто страница со ссылками на меня',en:'kotpro203 — just a page with links to me',lb:'kotpro203 — just eng Säit mat Linken op mech'}
  };
  let lang='ru';
  try{
    const saved=localStorage.getItem('bio-lang');
    if(['ru','en','lb'].includes(saved)) lang=saved;
  }catch(_){}

  const btn=document.getElementById('langBtn'),menu=document.getElementById('langMenu');
  let open=false;
  const setOpen=v=>{
    open=v;
    menu.hidden=!open;
    btn.setAttribute('aria-expanded',v);
  };
  btn.addEventListener('click',e=>{e.stopPropagation();setOpen(!open)});
  btn.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      setOpen(true);
      const sel=menu.querySelector('[aria-selected="true"]')||menu.querySelector('.menu-item');
      sel?.focus();
    }
  });
  document.addEventListener('pointerdown',e=>{
    if(!e.target.closest('.lang-w')) setOpen(false);
  });
  const langW=document.querySelector('.lang-w');
  if(langW) langW.addEventListener('focusout',e=>{
    if(!e.currentTarget.contains(e.relatedTarget)) setOpen(false);
  });
  addEventListener('keydown',e=>{
    if(e.key==='Escape' && open){
      setOpen(false);
      btn.focus();
    }
  });
  menu.addEventListener('keydown',e=>{
    const items=[...menu.querySelectorAll('.menu-item')];
    const idx=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){
      e.preventDefault();
      items[(idx+1)%items.length]?.focus();
    } else if(e.key==='ArrowUp'){
      e.preventDefault();
      items[(idx-1+items.length)%items.length]?.focus();
    } else if(e.key==='Home'){
      e.preventDefault();
      items[0]?.focus();
    } else if(e.key==='End'){
      e.preventDefault();
      items[items.length-1]?.focus();
    }
  });

  const apply=()=>{
    document.documentElement.lang=lang;
    document.getElementById('langCur').textContent=lang.toUpperCase();
    if(I18N.title[lang]) document.title=I18N.title[lang];
    const descEl=document.querySelector('meta[name="description"]');
    if(descEl && I18N['meta-desc'][lang]) descEl.setAttribute('content',I18N['meta-desc'][lang]);
    const ogDesc=document.getElementById('ogDesc');
    if(ogDesc && I18N['meta-desc'][lang]) ogDesc.setAttribute('content',I18N['meta-desc'][lang]);
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k=el.dataset.i18n;
      if(I18N[k]) el.textContent=I18N[k][lang];
    });
    const isLb=lang==='lb',isEn=lang==='en';
    btn.setAttribute('aria-label',isLb?'Sprooch':(isEn?'Language':'Язык'));
    const hs=document.querySelector('.hero');if(hs) hs.setAttribute('aria-label',isLb?'Iwwer mech':(isEn?'About me':'Обо мне'));
    const gr=document.querySelector('.grid');if(gr) gr.setAttribute('aria-label',isLb?'Linken':(isEn?'Links':'Ссылки'));
    menu.querySelectorAll('.menu-item').forEach(b=>
      b.setAttribute('aria-selected',b.dataset.lang===lang?'true':'false'));
  };
  menu.querySelectorAll('.menu-item').forEach(b=>
    b.addEventListener('click',()=>{
      lang=b.dataset.lang;
      try{localStorage.setItem('bio-lang',lang)}catch(_){}
      apply();
      setOpen(false);
      btn.focus();
    }));
  apply();
})();
/* Player logic */
(()=>{
  const audio = document.getElementById('audioEl');
  const playBtn = document.getElementById('playBtn');
  const playIco = document.getElementById('playIco');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const muteBtn = document.getElementById('muteBtn');
  const muteIco = document.getElementById('muteIco');

  if(!audio || !playBtn) return;

  const fmt = s => {
    if(isNaN(s) || s === Infinity) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  };

  const updatePlayState = playing => {
    const useTag = playIco.querySelector('use');
    if(useTag) useTag.setAttribute('href', playing ? '#i-pause' : '#i-play');
    playBtn.setAttribute('aria-label', playing ? 'Пауза' : 'Воспроизвести');
  };

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().then(() => updatePlayState(true)).catch(() => {});
    } else {
      audio.pause();
      updatePlayState(false);
    }
  });

  audio.addEventListener('play', () => updatePlayState(true));
  audio.addEventListener('pause', () => updatePlayState(false));
  audio.addEventListener('ended', () => {
    updatePlayState(false);
    progressFill.style.width = '0%';
    curTime.textContent = '0:00';
  });

  audio.addEventListener('loadedmetadata', () => {
    durTime.textContent = fmt(audio.duration);
  });

  let dragging = false;
  const updateProgress = pos => {
    const pct = pos * 100;
    progressFill.style.width = pct + '%';
    if (audio.duration) {
      curTime.textContent = fmt(pos * audio.duration);
      progressBar.setAttribute('aria-valuenow', Math.round(pct));
    }
  };
  const getPos = e => {
    const rect = progressBar.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  };

  audio.addEventListener('timeupdate', () => {
    if (dragging || !audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    curTime.textContent = fmt(audio.currentTime);
    progressBar.setAttribute('aria-valuenow', Math.round(pct));
  });

  progressBar.addEventListener('pointerdown', e => {
    dragging = true;
    progressBar.setPointerCapture(e.pointerId);
    updateProgress(getPos(e));
  });
  progressBar.addEventListener('pointermove', e => {
    if (dragging) updateProgress(getPos(e));
  });
  const commitSeek = e => {
    if (!dragging) return;
    dragging = false;
    if (audio.duration) audio.currentTime = getPos(e) * audio.duration;
  };
  progressBar.addEventListener('pointerup', commitSeek);
  progressBar.addEventListener('pointercancel', () => { dragging = false; });

  progressBar.addEventListener('keydown', e => {
    if (!audio.duration) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      audio.currentTime = Math.max(0, audio.currentTime - 5);
    }
  });

  muteBtn.addEventListener('click', () => {
    audio.muted = !audio.muted;
    const useTag = muteIco.querySelector('use');
    if(useTag) useTag.setAttribute('href', audio.muted ? '#i-volume-off' : '#i-volume-up');
    muteBtn.setAttribute('aria-label', audio.muted ? 'Включить звук' : 'Выключить звук');
  });
})();


const unpreload=()=>{
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.documentElement.classList.remove('preload');
  }));
};
if(document.readyState==='complete') unpreload();
else {
  addEventListener('load',unpreload,{once:true});
  setTimeout(unpreload,1500);
}
</script>
