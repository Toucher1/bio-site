<script>
// 1. Organic Canvas Background
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, canvas = document.getElementById('shapes-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d'), shapes = [
    { x: .12, y: .18, r: .25, c: '--md-sys-color-primary-container', a: .32, phX: 0, phY: 1.5, spX: .008, spY: .011, amp: 38 }, { x: .88, y: .35, r: .22, c: '--md-sys-color-tertiary-container', a: .34, phX: 2.3, phY: .8, spX: .009, spY: .013, amp: 34 },
    { x: .22, y: .75, r: .24, c: '--md-sys-color-secondary-container', a: .28, phX: 4.1, phY: 3.2, spX: .011, spY: .008, amp: 32 }, { x: .80, y: .82, r: .20, c: '--md-sys-color-surface-container-high', a: .40, phX: 1.2, phY: 4.5, spX: .013, spY: .010, amp: 26, isPill: true }
  ];
  let w = 0, h = 0, colors = {};
  const updateColors = () => { const s = getComputedStyle(document.documentElement); shapes.forEach(sh => colors[sh.c] = s.getPropertyValue(sh.c).trim() || '#2E5330'); };
  const render = () => {
    ctx.clearRect(0, 0, w, h); const minDim = Math.min(w, h);
    for (const s of shapes) {
      if (!reduce) { s.phX += s.spX; s.phY += s.spY; }
      const cx = s.x * w + Math.sin(s.phX) * s.amp, cy = s.y * h + Math.cos(s.phY) * s.amp, r = Math.max(100, minDim * s.r);
      ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = colors[s.c]; ctx.globalAlpha = s.a; ctx.beginPath();
      if (s.isPill) ctx.roundRect(-r * .8, -r * .4, r * 1.6, r * .8, r * .4);
      else for (let i = 0; i <= 60; i++) { const a = (i / 60) * Math.PI * 2, rad = r + (r * .12) * Math.cos(5 * a); ctx[i ? 'lineTo' : 'moveTo'](rad * Math.cos(a), rad * Math.sin(a)); }
      ctx.fill(); ctx.restore();
    }
    if (!reduce) requestAnimationFrame(render);
  };
  const resize = () => { w = canvas.width = innerWidth; h = canvas.height = innerHeight; updateColors(); render(); };
  addEventListener('resize', resize); resize();
  addEventListener('scroll', () => document.getElementById('topbar')?.classList.toggle('docked', scrollY > 8), { passive: true });
})();

// 2. Reveal Animations & i18n
(() => {
  const io = ('IntersectionObserver' in window) && new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .18 });
  document.querySelectorAll('.reveal').forEach(el => (!io || !el.offsetParent) ? el.classList.add('in') : io.observe(el));
  const I18N = {
    title: { ru: 'kotpro203 — bio', en: 'kotpro203 — bio', lb: 'kotpro203 — bio' }, skip: { ru: 'Перейти к содержимому', en: 'Skip to content', lb: 'Gitt op den Inhalt' },
    'hero-sub': { ru: 'Просто страница со ссылками на меня', en: 'Just a page with links to me', lb: 'Just eng Säit mat Linken op mech' }, 'meta-desc': { ru: 'kotpro203 — просто страница со ссылками на меня', en: 'kotpro203 — just a page with links to me', lb: 'kotpro203 — just eng Säit mat Linken op mech' }
  };
  let lang = 'ru';
  try { const s = localStorage.getItem('bio-lang'); if (['ru', 'en', 'lb'].includes(s)) lang = s; } catch (_) {}
  const btn = document.getElementById('langBtn'), menu = document.getElementById('langMenu');
  const setOpen = v => { menu.hidden = !v; btn.setAttribute('aria-expanded', v); };
  btn.onclick = e => { e.stopPropagation(); setOpen(menu.hidden); };
  btn.onkeydown = e => { if (['ArrowDown', 'ArrowUp'].includes(e.key)) { e.preventDefault(); setOpen(true); (menu.querySelector('[aria-selected="true"]') || menu.querySelector('.menu-item'))?.focus(); } };
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.lang-w')) setOpen(false); });
  document.querySelector('.lang-w')?.addEventListener('focusout', e => { if (!e.currentTarget.contains(e.relatedTarget)) setOpen(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { setOpen(false); btn.focus(); } });
  menu.onkeydown = e => {
    const items = [...menu.querySelectorAll('.menu-item')], i = items.indexOf(document.activeElement);
    const k = { ArrowDown: (i + 1) % items.length, ArrowUp: (i - 1 + items.length) % items.length, Home: 0, End: items.length - 1 }[e.key];
    if (k !== undefined) { e.preventDefault(); items[k]?.focus(); }
  };
  const apply = () => {
    document.documentElement.lang = lang; document.getElementById('langCur').textContent = lang.toUpperCase(); document.title = I18N.title[lang];
    document.querySelector('meta[name="description"]')?.setAttribute('content', I18N['meta-desc'][lang]); document.getElementById('ogDesc')?.setAttribute('content', I18N['meta-desc'][lang]);
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = I18N[el.dataset.i18n]?.[lang] || el.textContent);
    btn.setAttribute('aria-label', (lang === 'lb' ? 'Sprooch' : (lang === 'en' ? 'Language' : 'Язык')) + ': ' + lang.toUpperCase());
    document.querySelector('.hero')?.setAttribute('aria-label', lang === 'lb' ? 'Iwwer mech' : (lang === 'en' ? 'About me' : 'Обо мне'));
    document.querySelector('.grid')?.setAttribute('aria-label', lang === 'lb' ? 'Linken' : (lang === 'en' ? 'Links' : 'Ссылки'));
    menu.querySelectorAll('.menu-item').forEach(b => b.setAttribute('aria-selected', b.dataset.lang === lang ? 'true' : 'false'));
    window.dispatchEvent(new CustomEvent('bio-lang', { detail: lang }));
  };
  menu.querySelectorAll('.menu-item').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('bio-lang', lang); } catch (_) {} apply(); setOpen(false); btn.focus(); });
  apply();
})();

// 3. Audio Player Logic
(() => {
  const audio = document.getElementById('audioEl'), playBtn = document.getElementById('playBtn'), playIco = document.getElementById('playIco');
  const progressBar = document.getElementById('progressBar'), progressFill = document.getElementById('progressFill'), curTime = document.getElementById('curTime'), durTime = document.getElementById('durTime');
  const muteBtn = document.getElementById('muteBtn'), muteIco = document.getElementById('muteIco'), playerCard = document.getElementById('playerCard');
  if (!audio || !playBtn) return;
  const STRINGS = {
    ru: { player: 'Музыкальный плеер', seek: 'Перемотка', play: 'Воспроизвести', pause: 'Пауза', mute: 'Выключить звук', unmute: 'Включить звук' },
    en: { player: 'Music player', seek: 'Seek', play: 'Play', pause: 'Pause', mute: 'Mute', unmute: 'Unmute' },
    lb: { player: 'Musekspiller', seek: 'Spull', play: 'Ofspillen', pause: 'Paus', mute: 'Toun ausmaachen', unmute: 'Toun umaachen' }
  };
  const getS = k => (STRINGS[document.documentElement.lang] || STRINGS.ru)[k];
  const fmt = s => (!s || isNaN(s) || s === Infinity) ? '0:00' : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const updatePlayState = p => { playIco.querySelector('use')?.setAttribute('href', p ? '#i-pause' : '#i-play'); playBtn.setAttribute('aria-label', p ? getS('pause') : getS('play')); };
  const updateMuteState = () => { muteIco.querySelector('use')?.setAttribute('href', audio.muted ? '#i-volume-off' : '#i-volume-up'); muteBtn.setAttribute('aria-label', audio.muted ? getS('unmute') : getS('mute')); };
  const updateLabels = () => { playerCard?.setAttribute('aria-label', getS('player')); progressBar?.setAttribute('aria-label', getS('seek')); updatePlayState(!audio.paused); updateMuteState(); };
  window.addEventListener('bio-lang', updateLabels);

  playBtn.onclick = () => audio.paused ? audio.play().then(() => updatePlayState(true)).catch(() => {}) : (audio.pause(), updatePlayState(false));
  audio.onplay = () => updatePlayState(true); audio.onpause = () => updatePlayState(false);
  audio.onended = () => { updatePlayState(false); progressFill.style.width = '0%'; curTime.textContent = '0:00'; };
  audio.onloadedmetadata = () => durTime.textContent = fmt(audio.duration); if (audio.readyState >= 1) durTime.textContent = fmt(audio.duration);

  let dragging = false;
  const getPos = e => { const r = progressBar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  const updateProg = pos => { const pct = pos * 100; progressFill.style.width = pct + '%'; if (audio.duration) { curTime.textContent = fmt(pos * audio.duration); progressBar.setAttribute('aria-valuenow', Math.round(pct)); } };
  progressBar.onpointerdown = e => { dragging = true; try { progressBar.setPointerCapture(e.pointerId); } catch (_) {} updateProg(getPos(e)); };
  progressBar.onpointermove = e => { if (dragging) updateProg(getPos(e)); };
  progressBar.onpointerup = e => { if (dragging) { dragging = false; if (audio.duration) audio.currentTime = getPos(e) * audio.duration; } };
  progressBar.onpointercancel = () => { dragging = false; };
  progressBar.onkeydown = e => {
    if (!audio.duration) return;
    const dt = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
    if (dt) { e.preventDefault(); audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + dt)); }
    else if (e.key === 'Home') { e.preventDefault(); audio.currentTime = 0; }
    else if (e.key === 'End') { e.preventDefault(); audio.currentTime = audio.duration; }
  };
  audio.ontimeupdate = () => { if (!dragging && audio.duration) { const pct = (audio.currentTime / audio.duration) * 100; progressFill.style.width = pct + '%'; curTime.textContent = fmt(audio.currentTime); progressBar.setAttribute('aria-valuenow', Math.round(pct)); } };
  muteBtn.onclick = () => { audio.muted = !audio.muted; updateMuteState(); };
  updateLabels();
})();

const unpreload = () => requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('preload')));
document.readyState === 'complete' ? unpreload() : (addEventListener('load', unpreload, { once: true }), setTimeout(unpreload, 1500));
</script>
