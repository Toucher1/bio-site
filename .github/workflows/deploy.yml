name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          tar -czf - --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='AGENTS.md' --exclude='.DS_Store' --exclude='Thumbs.db' --exclude='*.bak' --exclude='*~' --exclude='*.swp' . | ssh -o StrictHostKeyChecking=accept-new root@151.245.112.241 "
            set -euo pipefail
            tar -xzf - -C /var/www/84.lu
            cp -a /var/www/84.lu/. /var/www/bio.openrepo.me/
            sed -i 's|https://84.lu/|https://bio.openrepo.me/|g' /var/www/bio.openrepo.me/index.html /var/www/bio.openrepo.me/sitemap.xml /var/www/bio.openrepo.me/robots.txt
            chown -R www-data:www-data /var/www/84.lu /var/www/bio.openrepo.me
          "
